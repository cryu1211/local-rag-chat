[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-rag-chat"
version = "0.1.0"
description = "A fully local RAG query pipeline with explicit context budgeting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "sentence-transformers>=3.0,<6",
    "faiss-cpu>=1.8,<2",
    "tokenizers>=0.19,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
local-rag = "local_rag_chat.cli:main"
local-llm = "local_rag_chat.llm_cli:main"
local-rag-query = "local_rag_chat.rag_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
